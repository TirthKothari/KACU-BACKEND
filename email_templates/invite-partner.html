<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Invitation</title>
</head>
<body style="margin:0;padding:0;background:#f0fdf4;font-family:Arial,sans-serif;color:#111827;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:24px 30px;background:#166534;color:#ffffff;">
              <h1 style="margin:0;font-size:22px;">Partner Invitation</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 30px;">
              <p style="margin:0 0 12px 0;line-height:1.6;">Hi {{ params.RecipientName }},</p>
              <p style="margin:0 0 12px 0;line-height:1.6;">{{ params.InviterName }} has invited you to join {{ params.BusinessName }} as a Partner.</p>
              <p style="margin:0 0 18px 0;line-height:1.6;">As a Partner, you can collaborate on referrals and business growth workflows.</p>
              <p style="margin:0 0 20px 0;"><a href="{{ params.Link }}" style="display:inline-block;padding:12px 18px;background:#166534;color:#ffffff;text-decoration:none;border-radius:8px;">Accept Partner Invite</a></p>
              <p style="margin:0;color:#6b7280;font-size:13px;">This link expires at {{ params.ExpiresAt }}.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

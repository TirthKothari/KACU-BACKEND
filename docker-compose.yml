version: '3.8'

services:
  web:
    build: .
    command: /app/entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/logs
    ports:
      - "8000:8000"
    env_file:
      - .env


volumes:
  static_volume:
  media_volume:
  logs_volume:
